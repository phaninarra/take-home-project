services:
  payee-directory:
    build: ./services/payee-directory
    ports:
      - "8081:8081"
    environment:
      API_KEY: pd_live_7f3c9a2e5b81
    mem_limit: 256m

  instruction-registry:
    build: ./services/instruction-registry
    ports:
      - "8082:8082"
    environment:
      KEY_ID: ir_key_01
      SHARED_SECRET: ir_secret_b82f1e6d
    mem_limit: 256m

  payment-executor:
    build: ./services/payment-executor
    ports:
      - "8083:8083"
      - "8093:8093"
    environment:
      CLIENT_ID: orchestrator
      CLIENT_SECRET: ex_secret_4d9b1c7a
    mem_limit: 256m

  settlement-returns:
    build: ./services/settlement-returns
    ports:
      - "8084:8084"
    mem_limit: 256m
